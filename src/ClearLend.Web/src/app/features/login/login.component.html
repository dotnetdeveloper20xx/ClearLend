<section class="auth-layout">
  <mat-card>
    <mat-card-header><mat-card-title>Sign in to ClearLend</mat-card-title><mat-card-subtitle>Access your borrower or business lender account.</mat-card-subtitle></mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <mat-form-field appearance="outline"><mat-label>Email</mat-label><input matInput type="email" formControlName="email" autocomplete="email"><mat-hint>Use the email from registration.</mat-hint>@if(form.controls.email.hasError('email')&&form.controls.email.touched){<mat-error>Enter a valid email address.</mat-error>}</mat-form-field>
        <mat-form-field appearance="outline"><mat-label>Password</mat-label><input matInput type="password" formControlName="password" autocomplete="current-password"></mat-form-field>
        @if(error()){<p class="error" role="alert">{{error()}}</p>}
        <button mat-flat-button color="primary" type="submit" [disabled]="loading()">{{loading()?'Signing in…':'Sign in securely'}}</button>
      </form>
    </mat-card-content>
    <mat-card-actions><a routerLink="/register">Create a borrower account</a><a routerLink="/lender/register">Create a lender account</a></mat-card-actions>
  </mat-card>
</section>
