<section class="auth-layout"><mat-card><mat-card-header><mat-card-title>Sign in to ClearLend</mat-card-title><mat-card-subtitle>View your borrower profile.</mat-card-subtitle></mat-card-header><mat-card-content><form [formGroup]="form" (ngSubmit)="submit()"><mat-form-field appearance="outline"><mat-label>Email</mat-label><input matInput type="email" formControlName="email" autocomplete="email"><mat-hint>Use the email from registration.</mat-hint></mat-form-field><mat-form-field appearance="outline"><mat-label>Password</mat-label><input matInput type="password" formControlName="password" autocomplete="current-password"></mat-form-field>@if(error()){<p class="error" role="alert">{{error()}}</p>}<button mat-flat-button color="primary" type="submit" [disabled]="loading()">{{loading()?'Signing in…':'Sign in'}}</button></form></mat-card-content><mat-card-actions><a routerLink="/register">Create a borrower account</a></mat-card-actions></mat-card></section>
